
name: Pizza Store CI

on:
  push:
    branches:
      - feature/vite-migration

  pull_request:
    branches:
      - feature/vite-migration

jobs:
  build:
    name: Build, Audit and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: docker build -t pizza-store:ci-test .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: pizza-store:ci-test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH


      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag pizza-store:ci-test vsclinuxcode/pizza-store:latest
          docker tag pizza-store:ci-test vsclinuxcode/pizza-store:${GITHUB_SHA}

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push vsclinuxcode/pizza-store:latest
          docker push vsclinuxcode/pizza-store:${GITHUB_SHA}
